apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-statefulset
  namespace: devboard
  labels:
    app: devboard-postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: devboard-postgres
  template:
    metadata:
      labels:
        app: devboard-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
          - containerPort: 5432
        env:
          # All three now come from the one Secret that External Secrets
          # Operator syncs from AWS. POSTGRES_USER used to come from a separate
          # ConfigMap, which meant the username and the password could drift
          # apart — rotate one, forget the other, and Postgres refuses logins.
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: devboard-secrets
                key: POSTGRES_USER
          
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: devboard-secrets
                key: POSTGRES_PASSWORD

          - name: POSTGRES_DB
            valueFrom:
              secretKeyRef:
                name: devboard-secrets
                key: POSTGRES_DB

          # Use a subdirectory as the data dir. When the volume is a real block
          # device (EBS), its filesystem root contains a lost+found directory,
          # and Postgres refuses to initdb into a non-empty mount point.
          - name: PGDATA
            value: /var/lib/postgresql/data/pgdata

        readinessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
          - name: init
            mountPath: /docker-entrypoint-initdb.d
            readOnly: true
          - name: data 
            mountPath: /var/lib/postgresql/data

      volumes:
        - name: init
          configMap:
            name: postgres-init 
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        # Named explicitly, not left to the cluster default. terraform/storage.tf
        # creates this class and marks it default; naming it anyway means a
        # missing class fails loudly instead of leaving the PVC Pending forever.
        storageClassName: gp3
        resources:
          requests:
            storage: 1Gi
