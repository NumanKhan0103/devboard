# Replaces the old k8s/secrets.yml, which committed this to Git:
#
#   POSTGRES_PASSWORD:  ZGV2Ym9hcmQ=   # this decodes to devboard
#
# Base64 is an ENCODING, not encryption. That file was a plaintext password in
# a public repository with a comment explaining how to read it.
#
# Now Git holds a POINTER. The value lives in AWS Secrets Manager and never
# enters this repository. External Secrets Operator reads it and writes a real
# Kubernetes Secret named "devboard-secrets" — which is why not a single
# Deployment or StatefulSet had to change. They all still say
# `secretKeyRef: {name: devboard-secrets}`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: devboard-secrets
  namespace: devboard
spec:
  # How often ESO re-reads AWS. Secrets Manager bills $0.05 per 10,000 API
  # calls, so "10s to make the demo snappy" is a real (small) bill if you
  # forget to change it back. To force a sync without waiting an hour:
  #   kubectl -n devboard annotate externalsecret devboard-secrets \
  #     force-sync=$(date +%s) --overwrite
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    # ESO creates a real Secret with THIS name. Keeping the old name is what
    # makes this a drop-in replacement.
    name: devboard-secrets
    creationPolicy: Owner
    deletionPolicy: Delete

    template:
      engineVersion: v2
      type: Opaque
      data:
        POSTGRES_USER: "{{ .username }}"
        POSTGRES_PASSWORD: "{{ .password }}"
        POSTGRES_DB: "{{ .dbname }}"
        # One JSON secret in AWS fans out into the four keys this app wants,
        # including the fully assembled DSN. The HOST is written here rather
        # than stored in Secrets Manager: "postgres" is topology, not a
        # credential, and it differs between the devboard and devboard-helm
        # namespaces.
        POSTGRES_URL: "postgres://{{ .username }}:{{ .password }}@postgres:5432/{{ .dbname }}?sslmode=disable"

  dataFrom:
    # extract = pull the whole JSON document and expose each key to the
    # template above. The alternative, `data:` with explicit property refs,
    # needs one entry per key.
    - extract:
        key: devboard/postgres
