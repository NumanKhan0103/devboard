# TLS certificate for the public hostname, issued by Let's Encrypt.
#
# The Secret lands in THIS namespace, which is why the Certificate lives here: a
# Gateway listener may only reference a Secret in its own namespace without a
# ReferenceGrant. Gateway is in devboard, Secret is in devboard.
#
# Start on letsencrypt-staging, confirm Ready=True, then switch to
# letsencrypt-prod. Change it in GIT — ArgoCD selfHeal reverts kubectl patch.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: devboard-tls
  namespace: devboard
spec:
  secretName: devboard-tls
  dnsNames:
    - devboard.trainwithshubham.com
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
    group: cert-manager.io
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  # Let's Encrypt certs last 90 days; renew 30 days out.
  renewBefore: 720h
