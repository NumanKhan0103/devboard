apiVersion: apps/v1
kind: Deployment
metadata:
  name: devboard-ai-service-deployment
  namespace: devboard
  labels:
    app: devboard-ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devboard-ai-service
  template:
    metadata:
      labels:
        app: devboard-ai-service
    spec:
      containers:
        - name: devboard-ai-service
          image: trainwithshubham/devboard-ai-service:sha-ceb5716
          ports:
            - containerPort: 3005
          env:
            - name: PORT
              value: "3005"
            # Task context comes from the Go backend in this same namespace.
            - name: TASK_SERVICE_URL
              value: http://backend:8080
            # Shared, cluster-wide Ollama model server (OpenAI-compatible).
            - name: MODEL_API_BASE
              value: http://ollama.ollama.svc.cluster.local:11434/v1
            - name: MODEL_NAME
              value: llama3.2:1b

            # --- OpenTelemetry -------------------------------------------
            # These are read by `opentelemetry-instrument` (the Dockerfile
            # CMD), not by any code we wrote. app/main.py has no OTel imports
            # at all — the instrumentation is applied to Flask and httpx at
            # process start, before our module loads.
            - name: OTEL_SERVICE_NAME
              value: ai-service
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector-gateway.observability.svc.cluster.local:4318
            # Both DevBoard stacks run an "ai-service". Without this they are
            # indistinguishable in Tempo.
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=raw,service.namespace=devboard
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            # Ship logs over OTLP too, so each record carries trace_id and
            # span_id as REAL fields. Loki stores them as structured metadata
            # and Grafana links log -> trace with no regex — compare with the
            # Go backend, which has to print trace_id= into its text logs.
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            - name: OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED
              value: "true"
            - name: OTEL_PYTHON_LOG_CORRELATION
              value: "true"
          # Readiness stays on /health, and deliberately does NOT check Ollama.
          # There is a /model/check endpoint that would report on the model
          # server — do not point a probe at it. If readiness tracked a
          # dependency, an Ollama restart would pull every ai-service pod out
          # of the Service, Envoy would answer a bodiless "503 no healthy
          # upstream" (strictly less useful than the error frame the app
          # returns), and Prometheus could no longer scrape /metrics — losing
          # observability exactly when it is needed. Readiness answers "can
          # this process serve a request?", not "will the request succeed?"
          # Dependency health is REPORTED (see the PrometheusRule in
          # gitops/observability/), never enforced.
          livenessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 10
            periodSeconds: 15
            # Don't kill a pod over one slow probe: under load every thread can
            # be busy streaming, and /health queues behind them.
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
