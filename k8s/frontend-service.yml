# ClusterIP: on EKS the Gateway (see gateway.yml + httproute.yml) exposes the
# frontend to the internet, so we no longer need NodePort.
# (On a local kind cluster without a Gateway controller, use `kubectl port-forward`
#  svc/devboard-frontend-service 8080:8080 instead.)
kind: Service
apiVersion: v1
metadata:
  name: devboard-frontend-service
  namespace: devboard
spec:
  type: ClusterIP
  selector:
    app: devboard-frontend
  ports:
  - protocol: TCP
    port: 8080       # Service port
    targetPort: 4173 # Pod port
