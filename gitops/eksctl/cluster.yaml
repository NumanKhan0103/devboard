apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: devboard
  region: us-west-2

# OIDC lets add-ons and workloads assume IAM roles (IRSA). The EBS CSI driver
iam:
  withOIDC: true

managedNodeGroups:
  - name: ng-default
    instanceType: t3.medium
    desiredCapacity: 3
    minSize: 2
    maxSize: 3
    volumeSize: 20   # GiB, root disk per node
    ssh:
      enableSsm: true

# Managed add-ons. aws-ebs-csi-driver is what lets the Postgres StatefulSet's
addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true
  - name: metrics-server
