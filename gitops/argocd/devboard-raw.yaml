# ArgoCD Application — deploys DevBoard WITHOUT Helm, straight from the raw
# manifests in k8s/. ArgoCD watches the gitops branch and keeps the cluster in
# sync with Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devboard-raw
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/LondheShubham153/devboard.git
    targetRevision: gitops
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: devboard

  syncPolicy:
    automated:
      prune: true      # delete resources removed from Git
      selfHeal: true   # revert manual drift back to Git
    syncOptions:
      - CreateNamespace=true
