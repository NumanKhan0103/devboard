# The "app of apps" — one Application whose job is to create OTHER Applications.
#
# You apply this ONE file. ArgoCD then creates and owns every piece of shared
# platform infrastructure: External Secrets Operator, the model server, and the
# whole observability stack. Adding a component later means committing a file
# into gitops/argocd/platform/ — never running kubectl again.
#
#   kubectl apply -f gitops/argocd/platform.yaml
#
# Note what is NOT here: devboard-raw.yaml and devboard-helm.yaml stay
# hand-applied. Chapters 07 and 09 teach "register an app by applying an
# Application manifest", and that lesson is worth keeping. The split is also
# honest — platform infra is installed once and shared; the application stacks
# are deployed twice, deliberately, to compare raw manifests against Helm.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
spec:
  project: default

  source:
    # Change repoURL to YOUR fork.
    repoURL: https://github.com/LondheShubham153/devboard.git
    targetRevision: mega-project
    path: gitops/argocd/platform

  destination:
    server: https://kubernetes.default.svc
    # The CHILD Applications are created here, in argocd. Each child then
    # deploys into its own namespace.
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
