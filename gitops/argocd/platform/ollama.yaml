# ArgoCD Application — the shared Ollama model server. Deployed once as platform
# infra; both DevBoard stacks' ai-service point at it.
#
# This used to be applied by hand in the AI chapter, which made it easy to skip
# — and skipping it produced the exact same symptom as the missing
# storageClassName on its PVC: a healthy-looking ai-service whose every request
# fails. Two different causes, one indistinguishable failure. Now the app-of-apps
# delivers it, so there is nothing to forget.
#
# Deliberately NOT part of the DevBoard Helm chart: that chart is installed
# twice (devboard and devboard-helm), which would give you two 1.3 GB model
# servers and ~4 GiB of duplicated RAM. Ollama is shared infrastructure, in the
# same category as Envoy Gateway and ArgoCD itself.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ollama
  namespace: argocd
  annotations:
    # Last. It is the heaviest pod in the cluster and nothing else waits on it.
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default

  source:
    # Change repoURL to YOUR fork.
    repoURL: https://github.com/LondheShubham153/devboard.git
    targetRevision: mega-project
    path: gitops/ollama

  destination:
    server: https://kubernetes.default.svc
    namespace: ollama

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
