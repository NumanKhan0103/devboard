# The ClusterSecretStore, kept in a SEPARATE Application from the operator.
#
# It has to be: a ClusterSecretStore is a custom resource, so its CRD must
# already be registered before this manifest can even be validated. Splitting
# the operator (wave 0) from its configuration (wave 1) is how you express
# "install the thing, then configure the thing" in ArgoCD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default

  source:
    # Change repoURL to YOUR fork.
    repoURL: https://github.com/LondheShubham153/devboard.git
    targetRevision: mega-project
    path: gitops/external-secrets

  destination:
    server: https://kubernetes.default.svc
    # ClusterSecretStore is cluster-scoped, so this namespace only decides
    # where ArgoCD tracks the resource, not where it takes effect.
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
