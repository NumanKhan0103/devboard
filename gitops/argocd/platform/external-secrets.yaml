# External Secrets Operator, installed by ArgoCD rather than by Terraform.
#
# Note the source: a HELM CHART REPOSITORY, not a path in this Git repo.
# ArgoCD can reconcile an upstream chart the same way it reconciles our
# manifests — the desired version is declared in Git (this file), so it is
# still GitOps. This also keeps the line clean: Terraform builds
# infrastructure, ArgoCD deploys workloads, and neither does the other's job.
#
# Terraform's only contribution is the IAM role and Pod Identity association
# (terraform/pod-identity.tf), which is why there are no credentials here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    # Wave 0: nothing else can sync until the CRDs exist.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default

  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: "2.8.0"
    helm:
      valuesObject:
        installCRDs: true
        serviceAccount:
          # Must match the service_account in the Pod Identity association in
          # terraform/pod-identity.tf. No eks.amazonaws.com/role-arn annotation
          # is needed — Pod Identity does not use one.
          create: true
          name: external-secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ESO's CRDs are larger than the 262144-byte limit on the
      # kubectl.kubernetes.io/last-applied-configuration annotation that
      # client-side apply writes. Without this you get
      # "metadata.annotations: Too long" and the sync fails outright.
      # Server-side apply has no such limit.
      - ServerSideApply=true
