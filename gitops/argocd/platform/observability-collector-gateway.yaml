# OpenTelemetry Collector, gateway role. Wave 2: its exporters point at Tempo, Loki and Prometheus, which must exist first.
#
# Two sources, which is the useful bit. Source 1 is the upstream chart straight
# from its Helm repo; source 2 is THIS repo contributing only a values file
# (note it has no `path`, just a `ref`). $values resolves to it. That is how
# you keep someone else's chart and your own configuration in two different
# places without vendoring the chart or inlining YAML inside YAML.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-collector-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default

  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-collector
      targetRevision: "0.169.0"
      helm:
        valueFiles:
          - $values/gitops/observability/collector-gateway-values.yaml

    - # Change repoURL to YOUR fork.
      repoURL: https://github.com/LondheShubham153/devboard.git
      targetRevision: mega-project
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Several of these charts ship CRDs larger than the 262144-byte limit on
      # the last-applied-configuration annotation client-side apply writes.
      - ServerSideApply=true
