# One connection to AWS Secrets Manager, shared by every namespace.
#
# ClusterSecretStore is cluster-scoped. The namespaced equivalent, SecretStore,
# would need one copy in `devboard` and another in `devboard-helm` — and a
# third the moment you add a namespace. Cluster-scoped is the right call when
# the credential source is a platform concern.
#
# It is also a clean platform/application boundary: the platform team owns the
# store (where secrets come from), each app team owns its ExternalSecret (which
# secrets it wants). Neither can be edited into the other's job.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager

      # Must match var.region in terraform/terraform.tfvars.
      region: us-west-2

      # There is deliberately NO `auth:` block here.
      #
      # Omit it and ESO falls through to the AWS SDK's default credential
      # chain, which on this cluster resolves to the EKS Pod Identity Agent.
      # No access keys, no eks.amazonaws.com/role-arn annotation on the
      # ServiceAccount, nothing to rotate. The IAM role and its association
      # are created in terraform/pod-identity.tf, and its policy is scoped to
      # arn:aws:secretsmanager:...:secret:devboard/* — ESO can read our
      # secrets and no others.
