# Two issuers on purpose. Let's Encrypt production allows only 5 authorization
# FAILURES per hostname per account per hour, and a misconfigured solver burns
# that in minutes. Staging runs the identical code path with far higher limits
# but an untrusted root, so browsers warn — which is the point: a staging cert
# that reaches Ready proves the plumbing works.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: trainwithshubham@gmail.com
    # ClusterIssuer, so this lands in the cert-manager namespace, not devboard.
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          # cert-manager creates a temporary HTTPRoute in the CERTIFICATE's
          # namespace with these parentRefs copied verbatim, and one Exact match
          # on /.well-known/acme-challenge/<token>. Keep the Certificate in
          # devboard or the solver route lands somewhere the Gateway rejects.
          gatewayHTTPRoute:
            parentRefs:
              - kind: Gateway
                name: devboard-gateway
                namespace: devboard
                # No sectionName on purpose: the solver route then attaches to
                # both :80 and :443, so renewals work whether Let's Encrypt hits
                # port 80 or follows the HTTP->HTTPS redirect.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: trainwithshubham@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - kind: Gateway
                name: devboard-gateway
                namespace: devboard
