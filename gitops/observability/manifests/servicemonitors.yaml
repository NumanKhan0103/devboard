# ServiceMonitors — how Prometheus finds things to scrape.
#
# A ServiceMonitor is a CRD: you describe WHICH Services to scrape and the
# Prometheus Operator writes the scrape_config for you and reloads Prometheus.
# That is the "operator pattern" — Prometheus' configuration becomes just
# another Kubernetes object, GitOps-managed like everything else, instead of a
# prometheus.yml somebody edits by hand and forgets to reload.
#
# NOTE: endpoints[].port matches the Service's PORT NAME, not its number. The
# DevBoard Services had unnamed ports until this chapter; naming them is the
# one change the application manifests needed for metrics.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: devboard-ai-service
  namespace: observability
  labels:
    app.kubernetes.io/part-of: devboard
spec:
  # Both DevBoard stacks, one rule. The k8s_attributes processor tags each
  # series with its namespace, so raw and Helm stay distinguishable.
  namespaceSelector:
    matchNames:
      - devboard
      - devboard-helm
  selector:
    matchLabels:
      app: devboard-ai-service
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: devboard-backend
  namespace: observability
  labels:
    app.kubernetes.io/part-of: devboard
spec:
  namespaceSelector:
    matchNames:
      - devboard
      - devboard-helm
  selector:
    matchLabels:
      app: devboard-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
# The Collector's own metrics. Observability needs observability: if the
# Collector is dropping spans because it hit its memory limiter, this is the
# only place that says so.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-collector-gateway
  namespace: observability
spec:
  namespaceSelector:
    matchNames:
      - observability
  selector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
  endpoints:
    # :8888 is the Collector's internal telemetry (queue depth, dropped spans).
    - port: metrics
      interval: 30s
      # :8889 is where spanmetrics publishes the RED metrics it derives from
      # traces. Different port, different data, easy to confuse.
    - port: prometheus
      interval: 30s
---
# Envoy Gateway's proxies publish their own metrics on :19001. This is where
# "how many 5xx did the edge return" lives — the number the user actually felt,
# as opposed to what any single service thinks it returned.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-gateway-proxies
  namespace: observability
spec:
  namespaceSelector:
    matchNames:
      - envoy-gateway-system
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
