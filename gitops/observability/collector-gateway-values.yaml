# OpenTelemetry Collector — GATEWAY role (a Deployment).
#
# We run the Collector twice, in two different roles, and the split is worth
# understanding before reading the config:
#
#   AGENT (DaemonSet, see collector-agent-values.yaml)
#     One per node. It is the only thing that can read /var/log/pods on its own
#     node's disk, which is the entire reason it exists. It enriches and
#     forwards; it knows nothing about Tempo or Loki.
#
#   GATEWAY (this file, a Deployment)
#     A small, horizontally scalable service. The single place that knows where
#     data actually goes, and the single place to do cluster-wide work like
#     deriving metrics from spans. Apps and Envoy push straight here.
#
# Chart: open-telemetry/opentelemetry-collector 0.169.0

mode: deployment
replicaCount: 1        # stateless — raise it once you trust the pipeline

# Chart 0.169.0 has no default image or command; both must be set explicitly.
# The "-k8s" distribution bundles the Kubernetes-flavoured components we use
# (k8s_attributes, file_log, spanmetrics) without the whole contrib kitchen sink.
image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
command:
  name: otelcol-k8s

fullnameOverride: otel-collector-gateway

# k8s_attributes asks the API server which pod owns an incoming connection, so
# the Collector needs read access to pods and namespaces.
clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: [pods, namespaces, nodes]
      verbs: [get, watch, list]
    - apiGroups: ["apps"]
      resources: [replicasets]
      verbs: [get, watch, list]

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

ports:
  otlp:
    enabled: true
  otlp-http:
    enabled: true
  # Where Prometheus scrapes the metrics that spanmetrics derives from traces.
  prometheus:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP
  jaeger-compact: { enabled: false }
  jaeger-thrift: { enabled: false }
  jaeger-grpc: { enabled: false }
  zipkin: { enabled: false }

# =============================================================================
# THE COLLECTOR CONFIG
# -----------------------------------------------------------------------------
# Read this top to bottom and you have the whole OpenTelemetry data model:
#
#   receivers   how data gets IN          (OTLP, Prometheus scrape, filelog...)
#   processors  what happens in the MIDDLE (batch, enrich, drop, limit)
#   connectors  one pipeline's OUTPUT feeding another pipeline's INPUT
#   exporters   where data goes OUT        (Tempo, Loki, Prometheus, stdout)
#   service.pipelines  which of the above are actually wired together
#
# The one rule that explains 90% of "why is my config not working":
# DECLARING A COMPONENT DOES NOTHING. Only listing it in a pipeline turns it
# on. You can define ten exporters and ship to none of them.
# =============================================================================
config:
  receivers:
    otlp:
      protocols:
        # gRPC :4317 — Envoy Gateway, the Go backend, and the node agents.
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        # HTTP :4318 — the Python ai-service. Same protobuf payload, different
        # transport. OTLP/HTTP is curl-able, which makes it far easier to debug.
        http:
          endpoint: ${env:MY_POD_IP}:4318

  processors:
    # ORDER MATTERS, and memory_limiter is always first. If the Collector is
    # about to run out of memory it starts refusing data here rather than
    # dying — a Collector that crashes loses everything it was holding, which
    # is strictly worse than one that drops the newest batch.
    memory_limiter:
      check_interval: 1s
      limit_percentage: 80
      spike_limit_percentage: 25

    # Attach k8s.namespace.name / k8s.pod.name / k8s.deployment.name by looking
    # the sender's IP up against the API server. This is how a span from
    # "ai-service" learns whether it came from the raw or the Helm stack —
    # without it, the two stacks are indistinguishable in Tempo.
    #
    # NOTE: renamed from `k8sattributes` in collector-contrib v0.149.0.
    k8s_attributes:
      auth_type: serviceAccount
      passthrough: false
      extract:
        metadata:
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.deployment.name
          - k8s.node.name
      pod_association:
        - sources:
            - from: connection

    # Batching is not optional in production. One network round trip per span
    # will melt both the Collector and whatever it exports to.
    batch:
      send_batch_size: 1024
      timeout: 5s

  connectors:
    # A CONNECTOR is an exporter on one pipeline and a receiver on another.
    # This one consumes traces and produces RED metrics (Rate, Errors,
    # Duration) — so you get per-service latency histograms without adding a
    # single line of metrics code to any application. It is also what draws
    # Grafana's service graph.
    spanmetrics:
      histogram:
        explicit:
          buckets: [10ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s, 10s, 30s, 60s]
      dimensions:
        - name: http.route
        - name: http.request.method
        - name: k8s.namespace.name
      metrics_flush_interval: 15s

  exporters:
    otlp/tempo:
      endpoint: tempo.observability.svc.cluster.local:4317
      tls:
        insecure: true   # in-cluster traffic; mTLS is a service-mesh concern

    # Loki 3.x speaks OTLP natively at /otlp — no Promtail, no loki exporter,
    # and trace_id arrives as structured metadata rather than text to regex.
    otlphttp/loki:
      endpoint: http://loki.observability.svc.cluster.local:3100/otlp

    prometheusremotewrite:
      endpoint: http://prometheus-operated.observability.svc.cluster.local:9090/api/v1/write
      tls:
        insecure: true
      # Copies k8s.namespace.name and friends onto every metric as labels.
      resource_to_telemetry_conversion:
        enabled: true

    # Prints telemetry to the Collector's own stdout. Add it to a pipeline and
    # `kubectl logs deploy/otel-collector-gateway -f` shows raw spans scrolling
    # past — the fastest way to answer "is anything arriving at all?".
    # Chapter 11 has you do exactly that.
    debug:
      verbosity: basic

  service:
    telemetry:
      metrics:
        # The Collector's own metrics, scraped by the ServiceMonitor in
        # manifests/. Observability needs observability.
        readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888

    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8s_attributes, batch]
        # Two destinations: Tempo stores the spans, spanmetrics turns them into
        # metrics. Same data, two uses — this is the connector in action.
        exporters: [otlp/tempo, spanmetrics]

      metrics:
        # Note spanmetrics appears here as a RECEIVER. Its output feeds this
        # pipeline's input; that is the whole idea of a connector.
        receivers: [otlp, spanmetrics]
        processors: [memory_limiter, k8s_attributes, batch]
        exporters: [prometheusremotewrite]

      logs:
        receivers: [otlp]
        processors: [memory_limiter, k8s_attributes, batch]
        exporters: [otlphttp/loki]
