# =============================================================================
# DevBoard Helm values
# -----------------------------------------------------------------------------
# Every knob you can turn lives here. The templates in templates/ read these
# values. Override any of them with `--set key=value` or a custom `-f my.yaml`.
# =============================================================================

# Optional name overrides. Leave blank to use the chart name ("devboard").
nameOverride: ""
fullnameOverride: ""
# -----------------------------------------------------------------------------
# Secrets. The DB credentials used to live right here in cleartext:
#
#   user: devboard
#   password: devboard        # <- in Git, in a public repo
#
# They now live in AWS Secrets Manager. External Secrets Operator reads them
# and materialises the same "devboard-secrets" Secret the templates already
# expected, so nothing downstream changed.
#
# Set enabled=false on a cluster with no ESO (a laptop kind cluster, say) and
# create the Secret by hand instead.
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# OpenTelemetry. Every service reports to the shared Collector in the
# "observability" namespace, installed once as platform infra by
# gitops/argocd/platform.yaml.
#
# Set enabled=false on a cluster without it. Both SDKs are built to fail safe:
# they log once that the Collector is unreachable and serve traffic untraced.
# The raw k8s/ manifests have no equivalent switch — that difference is a
# concrete answer to "why bother with Helm?".
# -----------------------------------------------------------------------------
observability:
  enabled: true
  # gRPC for the Go backend, HTTP for the Python ai-service. Same protobuf
  # payload; see the comments in each Deployment for why they differ.
  otlpGrpcEndpoint: otel-collector-gateway.observability.svc.cluster.local:4317
  otlpHttpEndpoint: http://otel-collector-gateway.observability.svc.cluster.local:4318
externalSecrets:
  enabled: true
  # Must match the secret created by terraform/secrets.tf.
  secretKey: devboard/postgres
  storeName: aws-secrets-manager
  # Secrets Manager bills per API call. Seconds-long intervals make for a
  # snappy demo and a surprising invoice if you forget to change it back —
  # use the force-sync annotation instead (see k8s/external-secret.yml).
  refreshInterval: 1h
# -----------------------------------------------------------------------------
# Postgres (in-cluster database, runs as a StatefulSet with a persistent disk)
# -----------------------------------------------------------------------------
postgres:
  image: postgres:16-alpine
  # No user/password/db here any more — see externalSecrets above. The username
  # and database name are credentials-adjacent and travel with the password in
  # one JSON secret, so that all three rotate together.
  #
  # The headless Service name Postgres is reachable at, in-cluster.
  # Keep it "postgres" — the assembled POSTGRES_URL points here.
  serviceName: postgres
  storage:
    size: 1Gi
    # Named explicitly rather than relying on the cluster default. terraform/
    # creates a "gp3" class and marks it default, but naming it here means the
    # chart also works on a cluster where the default is something else — and
    # a PVC that names a missing class fails loudly instead of hanging Pending.
    # Empty string falls back to whatever the cluster default is.
    storageClassName: "gp3"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
# -----------------------------------------------------------------------------
# Backend (Go + Gin API). Reachable in-cluster at the Service name "backend".
# The frontend image proxies /api -> http://backend:8080, so the Service name
# and port below MUST stay "backend" / 8080.
# -----------------------------------------------------------------------------
backend:
  image:
    repository: trainwithshubham/devboard-backend
    tag: sha-ceb5716
    pullPolicy: IfNotPresent
  replicas: 1
  serviceName: backend
  port: 8080
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
# -----------------------------------------------------------------------------
# Frontend (React served by `vite preview` on 4173). This is the only tier the
# Gateway exposes to the internet; it proxies /api to the backend internally.
# -----------------------------------------------------------------------------
frontend:
  image:
    repository: trainwithshubham/devboard-frontend
    # ":ai" is the rebuilt image that includes the AI Assistant page.
    tag: sha-ceb5716
    pullPolicy: IfNotPresent
  replicas: 1
  containerPort: 4173
  # The Service port the Gateway's HTTPRoute targets.
  servicePort: 8080
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  # Horizontal Pod Autoscaler. Needs metrics-server in the cluster to actually
  # scale (EKS does not ship it by default — see gitops docs).
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
# -----------------------------------------------------------------------------
# AI service (Flask, streaming SSE). Grounds answers in the project's tasks
# (fetched from the backend) and streams from an OpenAI-compatible model server.
# Reached from the browser under /api/ai/* (Gateway route + frontend proxy).
# -----------------------------------------------------------------------------
ai:
  enabled: true
  image:
    repository: trainwithshubham/devboard-ai-service
    tag: sha-ceb5716
    pullPolicy: IfNotPresent
  replicas: 1
  serviceName: ai-service
  port: 3005
  # Where to fetch task context (the Go backend in this release's namespace).
  taskServiceUrl: http://backend:8080
  # Shared, cluster-wide Ollama model server (OpenAI-compatible). No API key.
  ollamaUrl: http://ollama.ollama.svc.cluster.local:11434/v1
  modelName: llama3.2:1b
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 256Mi
# -----------------------------------------------------------------------------
# Gateway API (Envoy Gateway). Creates a Gateway + HTTPRoute so the app gets a
# public URL via an AWS NLB. Set enabled=false to skip (e.g. on a local cluster
# with no Gateway controller).
# -----------------------------------------------------------------------------
gateway:
  enabled: true
  # Must match the GatewayClass you created (see gitops/gateway/gatewayclass.yaml).
  className: envoy
  # HTTP listener port on the Gateway.
  listenerPort: 80
  # Leave empty to accept any hostname (correct for the raw LB DNS setup).
  hostname: ""
