{{- if .Values.externalSecrets.enabled }}
# Replaces the old templates/secret.yaml, which rendered the Postgres password
# straight out of values.yaml into a Secret — so the credential lived in Git.
#
# Now Git holds a pointer and AWS Secrets Manager holds the value. ESO writes a
# real Secret named "devboard-secrets", which is the name backend-deployment
# and postgres-statefulset already reference, so neither had to change.
#
# Gated on a toggle so the chart still renders on a laptop kind cluster that
# has no ESO and no AWS — set externalSecrets.enabled=false there.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: devboard-secrets
  labels:
    {{- include "devboard.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}

  secretStoreRef:
    name: {{ .Values.externalSecrets.storeName }}
    kind: ClusterSecretStore

  target:
    name: devboard-secrets
    creationPolicy: Owner
    deletionPolicy: Delete

    template:
      engineVersion: v2
      type: Opaque
      data:
        POSTGRES_USER: "{{ `{{ .username }}` }}"
        POSTGRES_PASSWORD: "{{ `{{ .password }}` }}"
        POSTGRES_DB: "{{ `{{ .dbname }}` }}"
        # Two templating layers meet here, which is why the backticks exist.
        # Helm renders first and would happily eat the ESO placeholders; the
        # backtick form makes Helm emit them verbatim so ESO resolves them at
        # sync time instead. The service name below IS Helm-templated, because
        # that is topology this chart owns rather than a value from AWS.
        # (Yes, a comment containing the raw placeholders would be eaten too.)
        POSTGRES_URL: "postgres://{{ `{{ .username }}` }}:{{ `{{ .password }}` }}@{{ .Values.postgres.serviceName }}:5432/{{ `{{ .dbname }}` }}?sslmode=disable"

  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.secretKey }}
{{- end }}
