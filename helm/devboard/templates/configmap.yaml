# The devboard-configmap that used to head this file is gone. Its only key was
# POSTGRES_USER, which now travels with the password in the one Secret that
# External Secrets Operator syncs — one source of truth instead of a ConfigMap
# and a Secret that could silently disagree.
#
# Init scripts, mounted into Postgres at /docker-entrypoint-initdb.d and run once
# on first boot (empty data volume). Loaded from the chart's files/ directory so
# the SQL stays readable and un-templated ($$ in plpgsql is left untouched).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    {{- include "devboard.labels" . | nindent 4 }}
data:
  01_schema.sql: |-
{{ .Files.Get "files/01_schema.sql" | indent 4 }}
  02_seed.sql: |-
{{ .Files.Get "files/02_seed.sql" | indent 4 }}
