{{- if .Values.gateway.enabled }}
# A Gateway asks the controller (Envoy Gateway) to provision a load balancer
# (an AWS NLB on EKS) and listen for traffic. HTTPRoutes attach to it.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "devboard.fullname" . }}-gateway
  labels:
    {{- include "devboard.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: {{ .Values.gateway.listenerPort }}
      {{- if .Values.gateway.hostname }}
      hostname: {{ .Values.gateway.hostname | quote }}
      {{- end }}
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
