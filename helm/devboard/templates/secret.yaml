# Sensitive values. Using stringData lets us write plain text — Kubernetes
# base64-encodes it for us. The backend consumes only POSTGRES_URL; we assemble
# it here from the same user/password/db so there is one source of truth.
apiVersion: v1
kind: Secret
metadata:
  name: devboard-secrets
  labels:
    {{- include "devboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.db | quote }}
  POSTGRES_URL: {{ printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" .Values.postgres.user .Values.postgres.password .Values.postgres.serviceName .Values.postgres.db | quote }}
