{{- if .Values.gateway.enabled }}
# Routes every path ("/") to the frontend Service. The frontend then proxies
# /api/* to the backend internally, so we only need one rule here.
#
# ADVANCED (optional): you could add a second rule that sends /api straight to
# the backend at the edge, stripping the prefix with a URLRewrite filter:
#
#   - matches:
#       - path: { type: PathPrefix, value: /api }
#     filters:
#       - type: URLRewrite
#         urlRewrite:
#           path: { type: ReplacePrefixMatch, replacePrefixMatch: / }
#     backendRefs:
#       - name: {{ .Values.backend.serviceName }}
#         port: {{ .Values.backend.port }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "devboard.fullname" . }}-route
  labels:
    {{- include "devboard.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "devboard.fullname" . }}-gateway
  {{- if .Values.gateway.hostname }}
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
  {{- end }}
  rules:
    {{- if .Values.ai.enabled }}
    # Exact matches, not one PathPrefix. A prefix is a wildcard: publishing
    # /ask also published /metrics to the internet at /api/ai/metrics.
    #
    # Tightening this file alone did NOT close that hole — the frontend
    # container ran its own vite proxy with a blanket /api/ai rule, so whatever
    # the Gateway declined fell through to "/" and the frontend forwarded it to
    # ai-service regardless. See frontend/vite.preview.config.js for the other
    # half of the fix.
    {{- range $ep := list "summarise" "ask" }}
    - matches:
        - path:
            type: Exact
            value: /api/ai/{{ $ep }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /{{ $ep }}
      # CPU inference streams slowly — raise the default (~15s) route timeout.
      timeouts:
        request: "300s"
        backendRequest: "300s"
      backendRefs:
        - name: {{ $.Values.ai.serviceName }}
          port: {{ $.Values.ai.port }}
    {{- end }}
    # No timeouts override: the 300s above is a property of STREAMING, not of
    # the service. A health check needing five minutes is not a health check.
    - matches:
        - path:
            type: Exact
            value: /api/ai/health
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /health
      backendRefs:
        - name: {{ .Values.ai.serviceName }}
          port: {{ .Values.ai.port }}
    {{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: devboard-frontend-service
          port: {{ .Values.frontend.servicePort }}
{{- end }}
