---
# Sets up an Ubuntu EC2 instance with the tools Deploy.md needs.
#
#   ansible-playbook -i inventory.ini playbook.yml
#
# Installs: AWS CLI v2, Terraform, kubectl, Helm, jq, dig, git, gh.

- name: Set up the DevBoard deployment machine
  hosts: devboard
  become: true

  vars:
    aws_region: us-west-2
    login_user: ubuntu

    # Match this to kubernetes_version in terraform/terraform.tfvars.
    kubectl_version: v1.34

    # Your AWS keys. Leave empty if the EC2 instance has an IAM role attached,
    # which is the safer option. For real use, encrypt them:
    #   ansible-vault encrypt_string 'AKIA...' --name aws_access_key
    aws_access_key: ""
    aws_secret_key: ""

    # Change this to YOUR fork.
    repo_url: https://github.com/LondheShubham153/devboard.git

  tasks:
    # ---------------------------------------------------------------- packages

    - name: Install the basics
      ansible.builtin.apt:
        name:
          - curl
          - dnsutils          # gives you `dig`, needed for the DNS step
          - git
          - jq
          - python3-debian    # lets Ansible manage apt repos
          - unzip
        state: present
        update_cache: true

    # ------------------------------------------------------------------- repos
    # Terraform, kubectl, Helm and gh are not in Ubuntu's own package list, so
    # we add each vendor's apt repository first.

    - name: Add the Terraform repo
      ansible.builtin.deb822_repository:
        name: hashicorp
        types: deb
        uris: https://apt.releases.hashicorp.com
        suites: "{{ ansible_distribution_release }}"
        components: main
        signed_by: https://apt.releases.hashicorp.com/gpg

    - name: Add the kubectl repo
      ansible.builtin.deb822_repository:
        name: kubernetes
        types: deb
        uris: "https://pkgs.k8s.io/core:/stable:/{{ kubectl_version }}/deb/"
        suites: "/"
        signed_by: "https://pkgs.k8s.io/core:/stable:/{{ kubectl_version }}/deb/Release.key"

    - name: Add the Helm repo
      ansible.builtin.deb822_repository:
        name: helm
        types: deb
        uris: https://baltocdn.com/helm/stable/debian/
        suites: all
        components: main
        signed_by: https://baltocdn.com/helm/signing.asc

    - name: Download the GitHub CLI key
      ansible.builtin.get_url:
        url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
        dest: /etc/apt/keyrings/githubcli.gpg
        mode: "0644"

    - name: Add the GitHub CLI repo
      ansible.builtin.deb822_repository:
        name: githubcli
        types: deb
        uris: https://cli.github.com/packages
        suites: stable
        components: main
        signed_by: /etc/apt/keyrings/githubcli.gpg

    - name: Install Terraform, kubectl, Helm and gh
      ansible.builtin.apt:
        name:
          - terraform
          - kubectl
          - helm
          - gh
        state: present
        update_cache: true

    # ----------------------------------------------------------------- aws cli
    # Ubuntu's `awscli` package is version 1, which has no `aws eks get-token`.
    # Every kubectl call against EKS needs that, so we install v2 from AWS.

    - name: Download the AWS CLI v2
      ansible.builtin.get_url:
        url: "https://awscli.amazonaws.com/awscli-exe-linux-{{ ansible_architecture }}.zip"
        dest: /tmp/awscliv2.zip
        mode: "0644"

    - name: Unzip the AWS CLI v2
      ansible.builtin.unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: true
        creates: /tmp/aws/install

    - name: Install the AWS CLI v2
      ansible.builtin.command:
        cmd: /tmp/aws/install --update
        creates: /usr/local/bin/aws

    # ------------------------------------------------------------------ config

    - name: Create the .aws folder
      ansible.builtin.file:
        path: "/home/{{ login_user }}/.aws"
        state: directory
        owner: "{{ login_user }}"
        group: "{{ login_user }}"
        mode: "0700"

    - name: Set the AWS region
      ansible.builtin.copy:
        content: |
          [default]
          region = {{ aws_region }}
          output = json
        dest: "/home/{{ login_user }}/.aws/config"
        owner: "{{ login_user }}"
        group: "{{ login_user }}"
        mode: "0600"

    - name: Save the AWS keys
      ansible.builtin.copy:
        content: |
          [default]
          aws_access_key_id = {{ aws_access_key }}
          aws_secret_access_key = {{ aws_secret_key }}
        dest: "/home/{{ login_user }}/.aws/credentials"
        owner: "{{ login_user }}"
        group: "{{ login_user }}"
        mode: "0600"
      no_log: true
      when: aws_access_key | length > 0

    - name: Add the region and a `k` shortcut to the shell
      ansible.builtin.copy:
        content: |
          export AWS_REGION={{ aws_region }}
          export AWS_DEFAULT_REGION={{ aws_region }}
          source <(kubectl completion bash)
          alias k=kubectl
        dest: /etc/profile.d/devboard.sh
        mode: "0644"

    - name: Clone the DevBoard repo
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "/home/{{ login_user }}/devboard"
        version: mega-project
        update: false
      become: true
      become_user: "{{ login_user }}"

    # ------------------------------------------------------------------ check

    - name: Check every tool works
      ansible.builtin.command:
        cmd: "{{ item }}"
      loop:
        - aws --version
        - terraform version
        - kubectl version --client
        - helm version --short
        - jq --version
        - git --version
        - gh --version
      register: tool_check
      changed_when: false

    - name: Show the versions
      ansible.builtin.debug:
        msg: "{{ tool_check.results | map(attribute='stdout_lines') | map('first') | list }}"

    - name: Show what to do next
      ansible.builtin.debug:
        msg:
          - "Done. Now:"
          - "  ssh {{ login_user }}@{{ ansible_host | default(inventory_hostname) }}"
          - "  aws sts get-caller-identity"
          - "  cd devboard && less Deploy.md"
