---
# Provision an Ubuntu EC2 instance as a DevBoard deployment workstation.
#
# Installs every tool Deploy.md section 0.1 requires, configures the AWS region,
# and asserts the versions are good before you spend 20 minutes on a
# terraform apply that was going to fail anyway.
#
# Usage:
#   cd ansible
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook site.yml --ask-vault-pass

- name: Provision the DevBoard deployment workstation
  hosts: devboard_workstation
  become: true
  gather_facts: true

  roles:
    - role: devboard

  post_tasks:
    - name: Print next steps
      ansible.builtin.debug:
        msg:
          - "Toolchain ready. Log in and continue from Deploy.md section 0.2:"
          - "  ssh {{ ansible_user | default('ubuntu') }}@{{ ansible_host | default(inventory_hostname) }}"
          - "  aws sts get-caller-identity"
          - "  cd devboard && less Deploy.md"
      tags:
        - verify
