---
# Map Ansible's architecture fact onto the naming apt and AWS each use.
_devboard_apt_arch:
  x86_64: amd64
  aarch64: arm64

_devboard_awscli_arch:
  x86_64: x86_64
  aarch64: aarch64

devboard_apt_arch: "{{ _devboard_apt_arch[ansible_architecture] }}"
devboard_awscli_arch: "{{ _devboard_awscli_arch[ansible_architecture] }}"

devboard_keyring_dir: /etc/apt/keyrings

# GitHub publishes a binary keyring rather than an armored key. deb822_repository
# saves a fetched signed_by URL as .asc, and apt rejects binary content in a .asc
# file, so this one is downloaded explicitly and referenced by path.
devboard_githubcli_keyring: "{{ devboard_keyring_dir }}/githubcli.gpg"

# suites "/" with no components is the deb822 spelling of a flat repository,
# which is what pkgs.k8s.io serves.
devboard_apt_repos:
  - name: hashicorp
    uris: https://apt.releases.hashicorp.com
    suites: "{{ ansible_distribution_release }}"
    components: [main]
    signed_by: https://apt.releases.hashicorp.com/gpg

  - name: kubernetes
    uris: "https://pkgs.k8s.io/core:/stable:/{{ devboard_kubectl_series }}/deb/"
    suites: "/"
    components: []
    signed_by: "https://pkgs.k8s.io/core:/stable:/{{ devboard_kubectl_series }}/deb/Release.key"

  - name: helm
    uris: https://baltocdn.com/helm/stable/debian/
    suites: all
    components: [main]
    signed_by: https://baltocdn.com/helm/signing.asc

  - name: githubcli
    uris: https://cli.github.com/packages
    suites: stable
    components: [main]
    signed_by: "{{ devboard_githubcli_keyring }}"
