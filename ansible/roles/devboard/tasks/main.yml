---
- name: Fail early on a non-Debian target
  ansible.builtin.assert:
    that:
      - ansible_os_family == "Debian"
    fail_msg: "This role targets Ubuntu. Found {{ ansible_os_family }}."
  tags:
    - always

- name: Fail early on an unmapped CPU architecture
  ansible.builtin.assert:
    that:
      - ansible_architecture in _devboard_apt_arch
    fail_msg: >-
      No package mapping for {{ ansible_architecture }}.
      Add it to roles/devboard/vars/main.yml.
  tags:
    - always

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ devboard_base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - packages

- name: Ensure the apt keyring directory exists
  ansible.builtin.file:
    path: "{{ devboard_keyring_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - repos

- name: Download the GitHub CLI keyring
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: "{{ devboard_githubcli_keyring }}"
    owner: root
    group: root
    mode: "0644"
  tags:
    - repos

- name: Add apt repositories
  ansible.builtin.deb822_repository:
    name: "{{ item.name }}"
    types: [deb]
    uris: "{{ item.uris }}"
    suites: "{{ item.suites }}"
    components: "{{ item.components if item.components | length > 0 else omit }}"
    architectures: "{{ devboard_apt_arch }}"
    signed_by: "{{ item.signed_by }}"
    state: present
    enabled: true
  loop: "{{ devboard_apt_repos }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Update apt cache
  tags:
    - repos

- name: Apply pending repository changes now
  ansible.builtin.meta: flush_handlers
  tags:
    - repos

- name: Install Terraform
  ansible.builtin.apt:
    name: "terraform{{ ('=' + devboard_terraform_version) if devboard_terraform_version | length > 0 else '' }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - terraform

- name: Install kubectl and Helm
  ansible.builtin.apt:
    name:
      - kubectl
      - helm
    state: present
  tags:
    - kubernetes

- name: Install the GitHub CLI
  ansible.builtin.apt:
    name: gh
    state: present
  tags:
    - gh

- name: Include AWS CLI tasks
  ansible.builtin.include_tasks: awscli.yml
  tags:
    - awscli

- name: Include user configuration tasks
  ansible.builtin.include_tasks: user_config.yml
  tags:
    - config

- name: Include verification tasks
  ansible.builtin.include_tasks: verify.yml
  tags:
    - verify
