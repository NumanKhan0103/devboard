---
- name: Ensure ~/.aws exists
  ansible.builtin.file:
    path: "/home/{{ devboard_user }}/.aws"
    state: directory
    owner: "{{ devboard_user }}"
    group: "{{ devboard_user }}"
    mode: "0700"

- name: Write the AWS region config
  ansible.builtin.template:
    src: aws_config.j2
    dest: "/home/{{ devboard_user }}/.aws/config"
    owner: "{{ devboard_user }}"
    group: "{{ devboard_user }}"
    mode: "0600"

# Skipped entirely when both values are empty, which is the correct state if
# the instance carries an IAM role instead.
- name: Write AWS credentials
  ansible.builtin.template:
    src: aws_credentials.j2
    dest: "/home/{{ devboard_user }}/.aws/credentials"
    owner: "{{ devboard_user }}"
    group: "{{ devboard_user }}"
    mode: "0600"
  no_log: true
  when:
    - devboard_aws_access_key_id | length > 0
    - devboard_aws_secret_access_key | length > 0

- name: Warn when no credentials were supplied
  ansible.builtin.debug:
    msg: >-
      No devboard_aws_access_key_id set, so ~/.aws/credentials was not written.
      The instance needs an attached IAM role, or `aws configure` by hand.
  when: devboard_aws_access_key_id | length == 0

- name: Install shell completion and aliases
  ansible.builtin.template:
    src: devboard_profile.sh.j2
    dest: /etc/profile.d/devboard.sh
    owner: root
    group: root
    mode: "0644"

- name: Clone the DevBoard repository
  ansible.builtin.git:
    repo: "{{ devboard_repo_url }}"
    dest: "/home/{{ devboard_user }}/devboard"
    version: "{{ devboard_repo_version }}"
    update: false
  become: true
  become_user: "{{ devboard_user }}"
  when: devboard_clone_repo | bool
