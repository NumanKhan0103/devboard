---
# Replace the host below with your EC2 instance's public DNS or IP.
#
#   ansible-playbook site.yml
#
# Amazon's Ubuntu AMIs log in as `ubuntu`. If you built the instance from a
# different AMI, change ansible_user to match.
all:
  children:
    devboard_workstation:
      hosts:
        devboard-ec2:
          ansible_host: CHANGE_ME.compute.amazonaws.com
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/CHANGE_ME.pem
