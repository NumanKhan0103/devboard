# Goal - To run End to End DevSecOps ci Pipeline

name: DevSecOps CI Pipeline

on:
    push:
        branches: [ master ]



jobs:

    # Code Stage ( with shift left)
    code-quality:
        uses: ./.github/workflows/code-quality.yml
    
    # Secret Stage ( with shift left)
    secret-scanning:
        permissions:
            contents: read
            security-events: write
        uses: ./.github/workflows/secret-scanning.yml
    
    dependency-check:
        uses: ./.github/workflows/dependency-scan.yml
    
    docker-scans:
        uses: ./.github/workflows/docker-scans.yml
        secrets: inherit
    
    sonar-scans:
        uses: ./.github/workflows/sonar-scan.yml
        secrets: inherit
    
    docker-push:
        uses: ./.github/workflows/docker-push.yml
        needs: [code-quality, secret-scanning, dependency-check, docker-scans, sonar-scans]
        secrets: inherit