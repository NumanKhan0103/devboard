# Goal is push the images to DockerHub and run deployment
name: Docker Build & Push

on:
  workflow_call:

jobs:
    docker-push:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        strategy:
            # front or backend fail never run this
            fail-fast: true
            matrix:
                folder: [frontend, backend]
        steps:
            # 1) Clone code 
            - name: Checkout
              uses: actions/checkout@v7
              with:
                persist-credentials: false
                fetch-depth: 0

             # 2) docker images push to docker hub
            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                context: ${{ matrix.folder}}
                push: true
                tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folder}}:latest
                
    # Final deployment
