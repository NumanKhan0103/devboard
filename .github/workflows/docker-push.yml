# Build and push the three service images, tagged with the commit SHA.
name: Docker Push

on:
  workflow_call:
    inputs:
      image_tag:
        description: Immutable tag to push (e.g. sha-abc1234)
        required: true
        type: string

jobs:
  build-push:
    runs-on: ubuntu-latest        # amd64 — matches the EKS nodes
    strategy:
      fail-fast: false
      matrix:
        folders: ['backend', 'frontend', 'ai-service']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # PUSH credential: this is the registry we publish to.
      - name: Docker Setup [Login]
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # PULL credential: backend/ and frontend/ build FROM dhi.io/* (Docker
      # Hardened Images), a separate registry that requires auth even on the
      # free tier. Same account, different host — so it needs its own login.
      - name: Docker Hardened Images [Login]
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build and Push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.folders }}
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folders }}:${{ inputs.image_tag }}
            ${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folders }}:latest
