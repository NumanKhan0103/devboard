# Goal - I have to do SAST for my Code

name: Code Quality

on:
    workflow_call:

jobs:
    sast:
        runs-on: ubuntu-latest
        steps:
            # 1) Code Checkout
            - name: Code Checkout
              uses: actions/checkout@v7
            
            # 2) Setup Node Js
            - name: Setup NodeJs
              uses: actions/setup-node@v6
              with:
                node-version: '22'
                cache: npm
                cache-dependency-path: 'frontend/package-lock.json'
            
            # 3) Install dependencies
            - name: Install npm Packages
              run: npm ci --legacy-peer-deps
              working-directory: frontend

            # 5) Run test case
            - name: Run tests
              run: npm run test --if-present
              working-directory: frontend
              
            # 6) Run Linter
            - name: Run Linter
              run: npm run lint
              working-directory: frontend

            # 7) Setup Go
            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                cache: TRUE
                go-version: '1.23'
                cache-dependency-path: backend/go.sum
            
            # 8) Install dependencies
            - name: Install dependencies
              run: go mod download
              working-directory: backend
                
            # 9) Lint the code
            - name: Run go formater
              run: go fmt ./...
              working-directory: backend

            # 10) Run go vet
            - name: Run Go Vet
              run: go vet ./...
              working-directory: backend
              
            # 11) Run test case
            - name: Run tests
              run: go test ./...
              working-directory: backend
