# Goal is to lint, build, and test both the frontend and backend, then push the images to DockerHub and run deployment
name: CI

on:
    push:
        branches: [advanced]
    pull_request:
        branches: [advanced]

jobs:
    frontend:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            # 1) Clone code 
            - name: Checkout
              uses: actions/checkout@v7
              with:
                persist-credentials: false
                fetch-depth: 0
            
            # 2) Setup Node Js
            - name: Setup Node.Js
              uses: actions/setup-node@v7
              with:
                node-version: '22'
                cache: 'npm'
                cache-dependency-path: 'frontend/package-lock.json'
            
            # 3) Install dependencies
            - name: Install dependencies
              run: npm ci
              working-directory: frontend
                
            # 4) Lint the code
            - name: Run Eslint
              run: npm run lint
              working-directory: frontend

            # 5) Run test case
            - name: Run tests
              run: npm run test --if-present
              working-directory: frontend
            
            # 6) Run Build
            - name: Run Build
              run: npm run build --if-present
              working-directory: frontend

           
            
