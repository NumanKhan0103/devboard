# Goal is to lint, build, and test both the frontend and backend, then push the images to DockerHub and run deployment
name: CI

on:
    push:
        branches: [advanced]
    pull_request:
        branches: [advanced]

jobs:
    frontend:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            # 1) Clone code 
            - name: Checkout
              uses: actions/checkout@v7
              with:
                persist-credentials: false
                fetch-depth: 0
            
            # 2) Setup Node Js
            - name: Setup Node.Js
              uses: actions/setup-node@v7
              with:
                node-version: '22'
                cache: 'npm'
                cache-dependency-path: 'frontend/package-lock.json'
            
            # 3) Install dependencies
            - name: Install dependencies
              run: npm ci
              working-directory: frontend
                
            # 4) Lint the code
            - name: Run Eslint
              run: npm run lint
              working-directory: frontend

            # 5) Run test case
            - name: Run tests
              run: npm run test --if-present
              working-directory: frontend
            
            # 6) Run Build
            - name: Run Build
              run: npm run build --if-present
              working-directory: frontend

            # 7) docker push
            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                context: frontend
                push: true
                tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-frontend:latest

    backend:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            # 1) Clone code 
            - name: Checkout
              uses: actions/checkout@v7
              with:
                persist-credentials: false
                fetch-depth: 0
            
            # 2) Setup Go
            - name: Setup Go 1.22
              uses: actions/setup-go@v7
              with:
                go-version: '1.22'
                cache: TRUE
                cache-dependency-path: 'backend/go.sum'
            
            # 3) Install dependencies
            - name: Install dependencies
              run: go mod download
              working-directory: backend
                
            # 4) Lint the code
            - name: Run go fmt
              run: go fmt ./...
              working-directory: backend

            # 5) Run test case
            - name: Run tests
              run: go test ./...
              working-directory: backend
            
            # 6) Run Build
            - name: Run Build
              working-directory: backend
              run: go build -o app ./cmd/devboard/backend
              

            # 7) docker push
            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                context: backend
                push: true
                tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-backend:latest
            
    