# Goal - Ensuer the docker files and docekr images are security tested
name: Docker Scans

on:
    workflow_call:

jobs:
    docker-file-lint:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                folder: [frontend, backend]
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                fetch-depth: 0

            - name: Docker file lint for ${{matrix.folder}}
              uses: hadolint/hadolint-action@v3.1.0
              with:
                dockerfile: ${{matrix.folder}}/Dockerfile
            
            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
                logout: true

            - name: Docker Image Build
              run: docker build -t ${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folder}}:latest .
              working-directory: ${{matrix.folder}}
            
            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: ${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folder}}:latest
                format: 'table'
                exit-code: '1'
                ignore-unfixed: true
                vuln-type: 'os,library'
                severity: 'CRITICAL'
                # severity: 'CRITICAL,HIGH'


    

            