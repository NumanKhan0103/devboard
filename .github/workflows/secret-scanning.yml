# Goal - To ensure no secrets have been leaked in the code

name: Secret Scanning

on:
    workflow_call:

jobs:
    gitleaks-scan:
        name: GitLeaks Scanner
        runs-on: ubuntu-latest
        steps:
            # 1) Code Checkout
            - name: Code Checkout
              uses: actions/checkout@v7
              with:
                fetch-depth: 0
            
            # 2) setup GAWK 
            - name: GitLeaks Scanner
              uses: gitleaks/gitleaks-action@v3
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                # GITLEAKS_ENABLE_COMMENTS: true
                # GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
                # GITLEAKS_ENABLE_SUMMARY: true
                # GITLEAKS_NOTIFY_USER_LIST: "@Siddhant1701"
                GITLEAKS_VERSION: latest

    betterleaks-scan:
        name: BetterLeaks Scanner
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write 

        steps:
            - name: Checkout full repository history
              uses: actions/checkout@v4
              with:
                fetch-depth: 0 # Crucial: Allows historical commit log analysis

            - name: Run Betterleaks Scan
              uses: dortort/betterleaks-action@v0.1.0 
              with:
                github-token: ${{ secrets.GITHUB_TOKEN }}
                version: 'latest'      # Always pull the newest engine optimizations
                scan-mode: 'auto'      # auto: pull_requests scan changed files; push scans git history
                fail-on-leak: 'true'   # Block the build/PR if an active secret is found
                validation: 'true'     # Runs active live token verification via async web requests
                redact: 'true'         # Masks cleartext secrets inside CI console logging logs

                
